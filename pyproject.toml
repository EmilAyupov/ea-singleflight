[project]
name = "singleflight"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Emil", email = "emilupx@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "devtools>=0.13.0",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
