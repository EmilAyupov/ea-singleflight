
[project]
name = "ea-singleflight"
version = "0.1.0"
description = "An asynchronous request coalescing utility for Python."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Emil", email = "emilupx@gmail.com" }]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "devtools>=0.13.0",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.uv.build-backend]
module-name = "singleflight"
